# ==========================================================================
#  Site settings
# ==========================================================================

title: Joseph Gozoya
subtitle: "Economist"
email: josephgozoya@gmail.com
description: >-
  Joseph Gozoya is an economist and PhD candidate at the University of Pretoria
  working on environmental economics, jobs and inequality, and migration in
  sub-Saharan Africa, using large-scale administrative data.

url: "https://josephgozoya.github.io"
baseurl: ""
repository: "josephgozoya/josephgozoya.github.io"
locale: "en-GB"

favicon: "/assets/images/favicon.ico"
logo: "/assets/images/favicon.png"
og_image: "/assets/images/image.png"

# Build settings
markdown: kramdown
remote_theme: "mmistakes/minimal-mistakes"
minimal_mistakes_skin: default

# Outputting
permalink: /:categories/:title/
paginate: 5
paginate_path: /page:num/
timezone: Africa/Johannesburg

words_per_minute: 200
breadcrumbs: false

search: true
search_provider: lunr
lunr:
  search_within_pages: true

include:
  - _pages
  - assets

# Plugins
plugins:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-feed
  - jemoji
  - jekyll-include-cache

collections:
  posts:
    output: true
    permalink: /:categories/:title/

# ==========================================================================
#  Author (sidebar profile)
# ==========================================================================

author:
  name     : "Joseph Gozoya"
  avatar   : "/assets/images/josephgozoya.jpg"
  bio      : "is a PhD Candidate in Economics at the University of Pretoria."
  location : "Pretoria, South Africa"
  links:
    - label: "Email"
      icon: "fas fa-fw fa-envelope"
      url: "mailto:josephgozoya@gmail.com"
    - label: "LinkedIn"
      icon: "fab fa-fw fa-linkedin"
      url: "https://www.linkedin.com/in/josephgozoya/"
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/josephgozoya"

footer:
  links:
    - label: "Email"
      icon: "fas fa-fw fa-envelope"
      url: "mailto:josephgozoya@gmail.com"
    - label: "LinkedIn"
      icon: "fab fa-fw fa-linkedin"
      url: "https://www.linkedin.com/in/josephgozoya/"
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/josephgozoya"

# ==========================================================================
#  Defaults
# ==========================================================================

defaults:
  # _posts
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
      read_time: true
      comments: false
      share: true
      related: true
  # _pages
  - scope:
      path: "_pages"
      type: pages
    values:
      layout: single
      author_profile: true

category_archive:
  type: liquid
  path: /categories/
tag_archive:
  type: liquid
  path: /tags/
