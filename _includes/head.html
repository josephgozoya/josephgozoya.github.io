{% assign locale = include.locale | default: site.locale %}
<meta charset="utf-8">

{% include seo.html locale=locale %}

{% unless site.atom_feed.hide %}
  <link href="{% if site.atom_feed.path %}{{ site.atom_feed.path }}{% else %}{{ '/feed.xml' | relative_url }}{% endif %}" type="application/atom+xml" rel="alternate" title="{{ site.title }} Feed">
{% endunless %}

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="author" content="Joseph Gozoya">
<meta name="robots" content="index, follow">
<meta name="theme-color" content="#1d4ed8">

<script>
  document.documentElement.className = document.documentElement.className.replace(/(^|\s)no-js(\s|$)/g, '$1') + ' js ';
</script>

<link rel="icon" type="image/png" href="{{ '/assets/images/favicon.png' | relative_url }}">
<link rel="icon" type="image/x-icon" href="{{ '/assets/images/favicon.ico' | relative_url }}">
<link rel="apple-touch-icon" href="{{ '/assets/images/favicon.png' | relative_url }}">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">

<link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
<link rel="preload" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@latest/css/all.min.css" as="style" onload="this.onload=null;this.rel='stylesheet'">
<noscript><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@latest/css/all.min.css"></noscript>

{% if page.url == "/" %}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Person",
  "name": "Joseph Gozoya",
  "givenName": "Joseph",
  "familyName": "Gozoya",
  "jobTitle": "Economist",
  "url": "{{ site.url }}/",
  "image": "{{ site.url }}/assets/images/josephgozoya.jpg",
  "email": "mailto:josephgozoya@gmail.com",
  "sameAs": [
    "https://www.linkedin.com/in/josephgozoya/",
    "https://github.com/josephgozoya"
  ],
  "affiliation": { "@type": "CollegeOrUniversity", "name": "University of Pretoria" },
  "address": { "@type": "PostalAddress", "addressLocality": "Pretoria", "addressCountry": "ZA" },
  "description": "Economist and PhD candidate researching environmental economics, jobs and inequality, and migration in sub-Saharan Africa using large-scale administrative data.",
  "knowsAbout": ["Environmental Economics", "Labour Economics", "Inequality", "Migration", "Development Economics", "Econometrics", "Administrative Data", "Causal Inference"]
}
</script>
{% endif %}

<script async src="https://www.googletagmanager.com/gtag/js?id=G-CCD8WD25BZ"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', 'G-CCD8WD25BZ');
</script>
